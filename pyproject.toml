[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honest-backtester"
version = "0.2.0"
description = "A conservative, no-lookahead event-driven backtesting framework for OHLCV strategies"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Ru" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
]

[project.optional-dependencies]
download = ["ccxt>=4.0"]
plot = ["matplotlib>=3.5"]
all = ["ccxt>=4.0", "matplotlib>=3.5"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/0xRuAI/honest-backtester"
Repository = "https://github.com/0xRuAI/honest-backtester"
Issues = "https://github.com/0xRuAI/honest-backtester/issues"

[tool.setuptools.packages.find]
include = ["backtester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
